# Complete rsdm configuration example.
#
# Default path: /etc/rsdm.toml. Override it with --config or RSDM_CONFIG.
# Every field is optional: an omitted field uses the default shown in its
# right-hand comment. Unknown fields are rejected by `rsdm validate-config`.
#
# Metadata format:
#   optional | TYPE | default: VALUE | values: ALLOWED VALUES
#
# Every supported field is listed below. Fields whose default is unset remain
# commented because TOML has no null value.

[session_manager]
# Wrap the compositor in a systemd --user graphical session and supervise it.
enabled = true # optional | bool | default: true | values: true, false
# Extra environment variable names exported after the Wayland socket appears.
extra_env = [] # optional | array<string> | default: [] | values: environment variable names
ready_timeout_secs = 10 # optional | integer | default: 10 | values: >= 0, seconds

[logging]
level = "info" # optional | string | default: "info" | values: error, warn, info, debug, trace
# Adds a plain-text file; journald remains enabled. The path must be absolute.
# file = "/var/log/rsdm/rsdm.log" # optional | string or unset | default: unset | values: absolute paths

[security]
deny_root = true # optional | bool | default: true | values: true, false
# When non-empty, a user must belong to at least one listed group.
allowed_groups = [] # optional | array<string> | default: [] | values: local group names
max_failed_attempts = 5 # optional | integer | default: 5 | values: 1..255
failure_delay_ms = 1200 # optional | integer | default: 1200 | values: >= 0, milliseconds

[paths]
cache_dir = "/var/cache/rsdm" # optional | string | default: "/var/cache/rsdm" | values: absolute paths

[dm]
enable = true # optional | bool | default: true | values: true, false
# PAM service means the matching /etc/pam.d/<name> stack, not a library path.
pam_service = "rsdm" # optional | string | default: "rsdm" | values: PAM service names
# Fixes one session and hides the picker. Leave unset to discover .desktop files.
# fixed_session = "niri-session" # optional | string or unset | default: unset | values: desktop id, session name, command
# Directories are searched in order when fixed_session is unset.
session_dirs = [
  "/run/current-system/sw/share/wayland-sessions",
  "/usr/share/wayland-sessions",
  "/usr/local/share/wayland-sessions",
] # optional | array<string> | default: paths shown above | values: absolute paths

[dm.tty]
path = "/dev/tty1" # optional | string | default: "/dev/tty1" | values: /dev/ttyN
seat = "seat0" # optional | string | default: "seat0" | values: logind seat names

[dm.remember]
username = true # optional | bool | default: true | values: true, false
session = true # optional | bool | default: true | values: true, false

[dm.fallback]
# Hands the VT to a console login if the greeter cannot start.
enabled = true # optional | bool | default: true | values: true, false
# Empty auto-detects the system getty; set argv only to override that behavior.
command = [] # optional | array<string> | default: [] | values: executable followed by arguments

[dm.design]
theme = "monochrome" # optional | string | default: "monochrome" | values: minimal, monochrome, cyberpunk, catppuccin, gruvbox, nord, dracula, tokyo-night, material, solarized, eldritch, rama, dark, trans-is-hard-job
border_style = "classic" # optional | string | default: "classic" | values: classic, modern, minimal, ascii1, ascii2, ascii3, ascii4, wave, pulse
background = "none" # optional | string | default: "none" | values: none, matrix, fire, rain, plasma, starfield
background_speed = 5 # optional | integer | default: 5 | values: 0..10
# "custom" uses title_text; "preset-logo" uses title_preset.
title_mode = "custom" # optional | string | default: "custom" | values: custom, hostname, os-release, session-name, preset-logo
# Unset custom title text renders "RSDM".
# title_text = "RSDM" # optional | string or unset | default: unset | values: any text
title_preset = "rsdm" # optional | string | default: "rsdm" | values: minimal, block, rsdm, rustty, waytty, niri, hyprland, kde, gnome, nixos, arch, tux
title_font = "ANSI Shadow" # optional | string | default: "ANSI Shadow" | values: figrs/FIGlet font names
show_clock = true # optional | bool | default: true | values: true, false
show_hostname = true # optional | bool | default: true | values: true, false
password_mode = "hidden" # optional | string | default: "hidden" | values: hidden, asterisks
menu = true # optional | bool | default: true | values: true, false
# These wallpaper fields are accepted here because both fronts share the same
# design schema, but the TTY Greeter ignores them.
# wallpaper = "/etc/rsdm-wallpaper.png" # optional | string or unset | default: unset | values: absolute PNG or JPEG paths
wallpaper_dim = 6 # optional | integer | default: 6 | values: 0 (black)..10 (unchanged)
background_opacity = 8 # optional | integer | default: 8 | values: 0 (wallpaper only)..10 (opaque effect)

[lock]
enable = false # optional | bool | default: false | values: true, false
pam_service = "rsdm-lock" # optional | string | default: "rsdm-lock" | values: PAM service names
# Unset selects the connected output with the largest pixel area.
# primary_output = "DP-1" # optional | string or unset | default: unset | values: Wayland output names
# "off" currently powers outputs down through niri IPC and falls back to black.
secondary_output = "background" # optional | string | default: "background" | values: background, black, off
# Unset uses the Greeter's actual console font at its native physical pixel size.
# Explicit values multiply both font dimensions; remove old size overrides to match TTY.
# size = 1 # optional | integer or unset | default: unset | values: 1..12

[lock.design]
# Lock design is independent from dm.design; omitted fields use their own defaults.
theme = "monochrome" # optional | string | default: "monochrome" | values: minimal, monochrome, cyberpunk, catppuccin, gruvbox, nord, dracula, tokyo-night, material, solarized, eldritch, rama, dark, trans-is-hard-job
border_style = "classic" # optional | string | default: "classic" | values: classic, modern, minimal, ascii1, ascii2, ascii3, ascii4, wave, pulse
background = "none" # optional | string | default: "none" | values: none, matrix, fire, rain, plasma, starfield
background_speed = 5 # optional | integer | default: 5 | values: 0..10
# "custom" uses title_text; "preset-logo" uses title_preset.
title_mode = "custom" # optional | string | default: "custom" | values: custom, hostname, os-release, session-name, preset-logo
# Unset custom title text renders "RSDM".
# title_text = "RSDM" # optional | string or unset | default: unset | values: any text
title_preset = "rsdm" # optional | string | default: "rsdm" | values: minimal, block, rsdm, rustty, waytty, niri, hyprland, kde, gnome, nixos, arch, tux
title_font = "ANSI Shadow" # optional | string | default: "ANSI Shadow" | values: figrs/FIGlet font names
show_clock = true # optional | bool | default: true | values: true, false
show_hostname = true # optional | bool | default: true | values: true, false
password_mode = "hidden" # optional | string | default: "hidden" | values: hidden, asterisks
menu = true # optional | bool | default: true | values: true, false
# Wallpaper is a base layer under the optional animated background.
# wallpaper = "/etc/rsdm-wallpaper.png" # optional | string or unset | default: unset | values: absolute PNG or JPEG paths
wallpaper_dim = 6 # optional | integer | default: 6 | values: 0 (black)..10 (unchanged)
background_opacity = 8 # optional | integer | default: 8 | values: 0 (wallpaper only)..10 (opaque effect)

[idle]
enable = false # optional | bool | default: false | values: true, false
timeout = 300 # optional | integer | default: 300 | values: 1..4294967, seconds
ignore_inhibitors = false # optional | bool | default: false | values: true, false
# Empty invokes this rsdm binary's built-in lock command without shell parsing.
lock_command = [] # optional | array<string> | default: [] | values: executable followed by arguments
# Hooks are shell commands and therefore must be treated as trusted configuration.
on_lock = [] # optional | array<string> | default: [] | values: shell command strings
on_unlock = [] # optional | array<string> | default: [] | values: shell command strings
