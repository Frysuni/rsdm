[workspace]
members = [
    "crates/rsdm-core",
    "crates/rsdm-infra",
    "crates/rsdm-session-manager",
    "crates/rsdm-system",
    "crates/rsdm-ui",
    "crates/rsdm-tui",
    "crates/rsdm-lock",
    "crates/rsdm-idle",
    "crates/rsdm-cli",
]
resolver = "3"

[workspace.package]
authors = ["Frys"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"
version = "2.5.0"
repository = "https://github.com/Frysuni/rsdm"
homepage = "https://github.com/Frysuni/rsdm"
description = "Standalone Rust TTY/TUI Wayland display manager and screen locker"

[workspace.dependencies]
anyhow = "1.0.104"
camino = { version = "1.2.6", features = ["serde1"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
font8x8 = "0.3.1"
figrs = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-client = "0.31.15"
zeroize = { version = "1.9.1", features = ["derive"] }
zbus = { version = "=6.3.0", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }
# Interface macros use runtime internals; keep both on the same release.
zbus_macros = "=6.3.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
