[workspace]
members = [
    "crates/rsdm-core",
    "crates/rsdm-infra",
    "crates/rsdm-ui",
    "crates/rsdm-tui",
    "crates/rsdm-lock",
    "crates/rsdm-idle",
    "crates/rsdm-cli",
]
resolver = "3"

[workspace.package]
authors = ["Frys"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"
version = "1.0.2"
repository = "https://github.com/Frysuni/rsdm"
homepage = "https://github.com/Frysuni/rsdm"
description = "Standalone Rust TTY/TUI Wayland display manager and screen locker"

[workspace.dependencies]
anyhow = "1.0.103"
camino = { version = "1.1.9", features = ["serde1"] }
clap = { version = "4.5.37", features = ["derive", "env"] }
crossterm = "0.29.0"
font8x8 = "0.3.1"
figrs = "0.3.1"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.186"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "underline-color"] }
serde = { version = "1.0.219", features = ["derive"] }
smithay-client-toolkit = "0.19.2"
thiserror = "2.0.12"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
toml = "0.8.22"
toml_edit = "0.22.27"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
wayland-protocols = { version = "=0.32.12", features = ["client", "staging"] }
wayland-client = "0.31.11"
zeroize = { version = "1.8.1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
