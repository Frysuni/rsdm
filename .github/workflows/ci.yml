name: ci

# Project policy: no cargo fmt/rustfmt, cargo clippy, or actionlint in workflows,
# including indirect invocations. See .github/CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev libwayland-dev libxkbcommon-dev libsm-dev libice-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: test
        run: cargo test --workspace --locked

  msrv:
    name: rust 1.88 (declared MSRV)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev libwayland-dev libxkbcommon-dev libsm-dev libice-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny (advisories, licenses, sources)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  nix:
    name: nix build + flake check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled

      - name: test stable channel publication
        run: python3 -B packaging/nix/test_update_stable.py

      # Evaluate every flake output; the package itself is built explicitly in
      # the next step so failures retain the full build log.
      - name: flake check (eval only)
        run: nix flake check --all-systems --no-build

      - name: build rsdm from source
        run: nix build .#rsdm-unstable --print-build-logs

      - name: test session lifecycle in isolated VMs
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.session-lifecycle \
            .#checks.x86_64-linux.native-niri \
            .#checks.x86_64-linux.native-de-handoff \
            .#checks.x86_64-linux.power-lifecycle \
            .#checks.x86_64-linux.lock-power \
            .#checks.x86_64-linux.dm-lifecycle

      - name: build prebuilt rsdm
        run: nix build .#rsdm-stable --print-build-logs
