name: ci

# Project policy: no cargo fmt/rustfmt, cargo clippy, or actionlint in workflows,
# including indirect invocations. See .github/CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev libwayland-dev libxkbcommon-dev libsm-dev libice-dev pkg-config

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: test
        run: cargo test --workspace --locked

  msrv:
    name: rust 1.88 (declared MSRV)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev libwayland-dev libxkbcommon-dev libsm-dev libice-dev pkg-config

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny (advisories, licenses, sources)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  nix:
    name: nix build + flake check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main
        with:
          use-flakehub: disabled

      - name: test stable channel publication
        run: python3 -B packaging/nix/test_update_stable.py

      # Evaluate every flake output; the package itself is built explicitly in
      # the next step so failures retain the full build log.
      - name: flake check (eval only)
        run: nix flake check --all-systems --no-build

      - name: build rsdm from source
        run: nix build .#rsdm-unstable --print-build-logs

      - name: test session lifecycle in isolated VMs
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.session-lifecycle \
            .#checks.x86_64-linux.native-niri \
            .#checks.x86_64-linux.native-de-handoff \
            .#checks.x86_64-linux.power-lifecycle \
            .#checks.x86_64-linux.lock-power \
            .#checks.x86_64-linux.dm-lifecycle

      - name: build prebuilt rsdm
        run: nix build .#rsdm-stable --print-build-logs
