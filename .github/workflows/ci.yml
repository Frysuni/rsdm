name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: test
        run: cargo test --workspace --locked

  msrv:
    name: rust 1.88 (declared MSRV)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny (advisories, licenses, sources)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  nix:
    name: nix build + flake check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled

      # Evaluate every flake output; the package itself is built explicitly in
      # the next step so failures retain the full build log.
      - name: flake check (eval only)
        run: nix flake check --no-build

      - name: build rsdm from source
        run: nix build .#rsdm-source --print-build-logs

      - name: build prebuilt rsdm
        run: nix build .#rsdm-prebuilt --print-build-logs
